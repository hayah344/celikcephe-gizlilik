name: supabase-keepalive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase REST ping
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://dzfqfdjdmddjhmvviyvk.supabase.co/rest/v1/app_meta?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6ZnFmZGpkbWRkamhtdnZpeXZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2NjEwMDEsImV4cCI6MjA5ODIzNzAwMX0.M5FRH4hNcgXwiUi0bm9P6tMs9JMqrDZo7B8oaTaH5dI")
          echo "Supabase HTTP: $code"
          if [ -z "$code" ] || [ "$code" = "000" ]; then exit 1; fi

      - name: Heartbeat commit
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-ping.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive@users.noreply.github.com"
          git add .keepalive/last-ping.txt
          git commit -m "keepalive $(date -u +%F)" || echo "no change"
          git push || echo "push skipped"
